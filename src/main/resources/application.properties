spring.application.name=LEARN
# Database configuration
spring.datasource.url=jdbc:postgresql://ai-tutor-db.cjwgw4qwmu8l.us-east-2.rds.amazonaws.com:5432/ai_tutor_db
spring.datasource.username=tutoradmin
spring.datasource.password=REMOVED_SECRET
spring.datasource.driver-class-name=org.postgresql.Driver
